# Локально:   docker compose up --build            → http://localhost:8000/miniapp
# С HTTPS:    docker compose --profile https up -d   (нужны DOMAIN и DNS A-запись на сервер)
name: personalizer

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: personalizer
      POSTGRES_USER: personalizer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personalizer -d personalizer"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://personalizer:${POSTGRES_PASSWORD}@db:5432/personalizer
      SERVE_FRONTEND: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    profiles: ["https"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
