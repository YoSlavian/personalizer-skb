# Сброс публичного демо к исходным синтетическим данным.
# Демо-учётками пользуются все зрители ссылки, поэтому база копит чужие заявки, задачи и черновики.
# Работает только после того, как владелец репозитория добавит секрет DEMO_DATABASE_URL
# (Settings → Secrets and variables → Actions; значение — DATABASE_URL_UNPOOLED базы Neon из Vercel → Storage).
# Без секрета задача ничего не делает. Вручную: Actions → «Сброс публичного демо» → Run workflow.
# Сброс выкидывает всех из сессий и стирает привязки Telegram — после него персону выбирают заново.
name: Сброс публичного демо

on:
  schedule:
    # 03:17 и 09:17 по МСК (00:17 и 06:17 UTC): ночью и утром, далеко от окна защиты.
    # Расписание GitHub может опаздывать, поэтому в окне 16:00–19:00 МСК плановый запуск пропускается (шаг ниже)
    - cron: "17 0,6 * * *"
  workflow_dispatch: {}

concurrency:
  group: demo-reset
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Проверить секрет и время
        id: guard
        env:
          DEMO_DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
        run: |
          if [ -z "$DEMO_DATABASE_URL" ]; then
            echo "Секрет DEMO_DATABASE_URL не задан — сброс пропущен"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now=$(date -u +%H%M)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$now" -ge 1230 ] && [ "$now" -lt 1600 ]; then
            echo "Плановый запуск опоздал в окно защиты (12:30–16:00 UTC) — сброс пропущен"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != '1'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != '1'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Сбросить демо-базу
        if: steps.guard.outputs.skip != '1'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
          # Сид отказывается сбрасывать базу при ENVIRONMENT=production. Вместо этого предохранителя —
          # проверка ниже: в базе должны быть демо-учётки, иначе это не демо-база и сброс отменяется
          ENVIRONMENT: development
          DEMO_MODE: "true"
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          pip install -q -r requirements.txt
          python -m alembic upgrade head
          python - <<'PY'
          import asyncio
          from sqlalchemy import func, select
          from app import db as dbmod
          from app.models import User

          async def main() -> None:
              async with dbmod.session_factory()() as s:
                  total = (await s.execute(select(func.count()).select_from(User))).scalar_one()
                  demo = (await s.execute(select(func.count()).select_from(User).where(User.email == "analyst@demo.local"))).scalar_one()
              if total and not demo:
                  raise SystemExit("В базе нет демо-учётки analyst@demo.local — похоже, это не демо-база. Сброс отменён")
              print(f"Демо-база: пользователей {total}")

          asyncio.run(main())
          PY
          python -m app.seed --reset
          python - <<'PY'
          import asyncio
          from sqlalchemy import select
          from app import db as dbmod
          from app.models import User
          from app.services.users import ensure_bootstrap_admin

          async def main() -> None:
              async with dbmod.session_factory()() as s:
                  fd = (await s.execute(select(User.id).where(User.email == "fd@pole-invest.demo"))).scalar_one_or_none()
                  if fd is None:
                      raise SystemExit("После сида нет учётки fd@pole-invest.demo — сид не дошёл до конца, запустите сброс ещё раз")
                  # Личный администратор из ADMIN_EMAIL / ADMIN_PASSWORD (если секреты заданы) — сразу, не дожидаясь холодного старта
                  problem = await ensure_bootstrap_admin(s)
                  if problem:
                      print(problem)
              print("Демо-база сброшена и проверена")

          asyncio.run(main())
          PY
